<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Table</title>
        <style>
            *{margin:0;padding:0;}
            body{height:100vh;}
            header{background:black;color:white;height:10%;text-align: center;}
            footer{height:10%;background:black;}
            main{height:80%;background-color: rgb(239, 250, 250);display:flex;align-items: center;justify-content: center;}
            table th,td{border:2px solid rgb(164, 164, 230);border-collapse: collapse;background-color: aqua;padding:30px;}
        </style>
    </head>
    <body>
        <header>
            <h1>Table</h1>
        </header>
        <main>
            <table cellspacing="10">
                <tr>
                    <th></th><th></th><th></th>
                </tr>
                <tr>
                    <td></td><td></td><td rowspan="5"></td>
                </tr>
                <tr>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td></td><td rowspan="2"></td>
                </tr>
                <tr>
                    <td></td>
                </tr>
                <tr>
                    <td></td><td></td>
                </tr>
            </table>
        </main>
        <footer>

        </footer>
    </body>
</html>
