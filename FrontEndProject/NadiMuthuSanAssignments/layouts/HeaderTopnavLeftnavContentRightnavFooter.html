<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>HeaderTopnavLeftnavContentRightnavFooter</title>
        <style>
            *{margin:0px;}
            h1{text-align:center;}
            header{height:10%;background-color: black;color:white;}
            div{height:70%;width:100%;color:black;border-top:15px solid white;border-bottom:15px solid white;display:flex;}
            footer{height:10%;background-color: black;color:white;}
            body{height:100vh;line-height: 1.5;font-family:'Courier New', Courier, monospace}
            main{width:50%;background-color: rgb(192, 189, 189);}
            .leftnav{width:25%;border-right:15px solid white;background-color: rgb(244, 236, 236);}
            .rightnav{width:25%;border-left:15px solid white;background-color: rgb(244, 236, 236);}
            .topnav{height:10%;background-color: rgb(244, 236, 236);border-top:15px solid white;}
        </style>
    </head>
    <body>
        <header>
            <h1>Header</h1>
        </header>
        <nav class="topnav">
            <h1>Top Nav</h1>
        </nav>
        <div>
            <nav class="leftnav">
                <h1>LeftNav</h1>
            </nav>
            <main>
                <h1>Fill out the Contents</h1>
            </main>
            <nav class="rightnav">
                <h1>Right Nav</h1>
            </nav>
        </div>
        <footer>
            <h1>Footer</h1>
        </footer>
    </body>
</html>
